<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Shadow -->
  <ellipse cx="32" cy="60" rx="14" ry="2.5" fill="#1C1917" opacity="0.08"/>
  <!-- Phone body -->
  <rect x="18" y="4" width="28" height="52" rx="5" fill="#292524"/>
  <rect x="19" y="5" width="26" height="50" rx="4.5" fill="#1C1917"/>
  <!-- Screen -->
  <rect x="21" y="10" width="22" height="38" rx="2" fill="#44403C"/>
  <!-- Call screen UI -->
  <!-- Contact avatar -->
  <circle cx="32" cy="22" r="6" fill="#57534E"/>
  <circle cx="32" cy="20" r="2.5" fill="#78716C"/>
  <path d="M26 27 Q26 24 32 23 Q38 24 38 27" fill="#78716C"/>
  <!-- Name -->
  <rect x="26" y="30" width="12" height="1.5" rx="0.75" fill="#A8A29E"/>
  <!-- "calling..." text -->
  <rect x="28" y="33" width="8" height="1" rx="0.5" fill="#78716C"/>
  <!-- Call buttons -->
  <!-- Decline (red) -->
  <circle cx="26" cy="42" r="3.5" fill="#C2491D"/>
  <path d="M23.5 42 L28.5 42" stroke="#F5F0E8" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Accept (green) -->
  <circle cx="38" cy="42" r="3.5" fill="#5E7A5E"/>
  <path d="M36 40.5 Q38 43 40 40.5" stroke="#F5F0E8" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <!-- Top notch -->
  <rect x="28" y="6" width="8" height="2.5" rx="1.25" fill="#292524"/>
  <!-- Home indicator -->
  <rect x="28" y="52" width="8" height="1.5" rx="0.75" fill="#44403C"/>
</svg>
