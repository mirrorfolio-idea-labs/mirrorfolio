<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Top strap -->
  <rect x="22" y="4" width="20" height="16" rx="4" fill="#57534E"/>
  <rect x="24" y="4" width="16" height="14" rx="3" fill="#44403C"/>
  <!-- Watch body -->
  <rect x="16" y="18" width="32" height="28" rx="6" fill="#292524"/>
  <rect x="18" y="20" width="28" height="24" rx="5" fill="#1C1917"/>
  <!-- Screen -->
  <rect x="21" y="23" width="22" height="18" rx="3" fill="#44403C"/>
  <!-- Heart rate line -->
  <path d="M24 33 L28 33 L30 28 L33 38 L35 30 L37 33 L40 33" stroke="#C2491D" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Time display -->
  <text x="32" y="27" text-anchor="middle" font-size="4" fill="#A8A29E" font-family="sans-serif">08:42</text>
  <!-- Battery indicator (low) -->
  <rect x="35" y="24" width="6" height="2.5" rx="0.5" fill="none" stroke="#78716C" stroke-width="0.5"/>
  <rect x="35.5" y="24.5" width="1.5" height="1.5" rx="0.3" fill="#C2491D"/>
  <!-- Side button -->
  <rect x="48" y="28" width="3" height="8" rx="1.5" fill="#57534E"/>
  <!-- Bottom strap -->
  <rect x="22" y="46" width="20" height="14" rx="4" fill="#57534E"/>
  <rect x="24" y="46" width="16" height="12" rx="3" fill="#44403C"/>
  <!-- Strap holes -->
  <circle cx="32" cy="52" r="1" fill="#292524"/>
  <circle cx="32" cy="55" r="1" fill="#292524"/>
</svg>
